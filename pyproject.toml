[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "options-book-imbalance"
version = "0.1.0"
description = "Causal order-book imbalance study on public options quotes"
requires-python = ">=3.10"
dependencies = ["websocket-client>=1.6,<2"]

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]

[project.scripts]
options-book = "options_book_imbalance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
